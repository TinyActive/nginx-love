services:
  postgres:
    image: postgres:15-alpine
    container_name: nginx-love-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nginx_love_db}
      POSTGRES_USER: ${DB_USER:-nginx_love_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nginx-love
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nginx_love_user} -d ${DB_NAME:-nginx_love_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nginx-love-base:latest}
    image: nginx-love-backend:${IMAGE_TAG:-local}
    container_name: nginx-love-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-nginx_love_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-nginx_love_db}?schema=public
      PORT: ${API_PORT:-3001}
      NODE_ENV: ${NODE_ENV:-production}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      API_BEHIND_PROXY: ${API_BEHIND_PROXY:-true}
      DISABLE_CORS: ${DISABLE_CORS:-true}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      TWO_FACTOR_APP_NAME: ${TWO_FACTOR_APP_NAME:-Nginx Love Admin}
      SSL_DIR: ${SSL_DIR:-/etc/nginx/ssl}
      ACME_DIR: ${ACME_DIR:-/var/www/html/.well-known/acme-challenge}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      PROJECT_ROOT: /app
      SKIP_NGINX_INSTALL: "true"
    expose:
      - "3001"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_conf:/etc/nginx
      - nginx_logs:/var/log
      - nginx_ssl:/etc/nginx/ssl
      - acme_challenge:/var/www/html/.well-known/acme-challenge
      - backups:/var/backups
    networks:
      - nginx-love
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        BACKEND_URL: http://backend:3001
    image: nginx-love-frontend:${IMAGE_TAG:-local}
    container_name: nginx-love-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3001
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks:
      - nginx-love
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  nginx_conf:
  nginx_logs:
  nginx_ssl:
  acme_challenge:
  backups:

networks:
  nginx-love:
    driver: bridge
