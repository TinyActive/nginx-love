# Legacy VM frontend — static UI + /api reverse proxy (matches Docker frontend behavior)
worker_processes auto;
pid /var/run/nginx-love-frontend.pid;
error_log /var/log/nginx-love-frontend-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx-love-frontend.log;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    server {
        listen 8080;
        server_name _;
        root {{PROJECT_DIR}}/apps/web/dist;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:3001/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
