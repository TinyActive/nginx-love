# Database only — shared credentials with main stack
# Usage: docker compose -f docker-compose.db.yml --env-file .env up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: nginx-love-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nginx_love_db}
      POSTGRES_USER: ${DB_USER:-nginx_love_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nginx-love
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nginx_love_user} -d ${DB_NAME:-nginx_love_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  nginx-love:
    driver: bridge
